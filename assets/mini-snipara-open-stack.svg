<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Mini Snipara Open Stack</title>
  <desc id="desc">A local project flows into snipara-companion, snipara-memory, and snipara-evals, with an optional connection to hosted Snipara for shared project intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label{font:700 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .tiny{font:600 10px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#64748b}
      .white{fill:#fff}
      .line{stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .dash{stroke-dasharray:7 7}
    </style>
  </defs>

  <rect width="920" height="300" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="884" height="264" rx="24" fill="none" stroke="#e2e8f0"/>

  <g filter="url(#shadow)">
    <rect x="48" y="92" width="164" height="116" rx="20" fill="#ffffff"/>
  </g>
  <text x="130" y="126" text-anchor="middle" class="tiny">Your repo</text>
  <text x="130" y="154" text-anchor="middle" class="label">Local project</text>
  <text x="130" y="180" text-anchor="middle" class="small">files, logs, phases</text>
  <path d="M88 204h84" class="line"/>
  <path d="M92 214h76" class="line" opacity=".45"/>

  <path d="M226 150h66" class="line" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="304" y="52" width="312" height="196" rx="26" fill="#ffffff"/>
  </g>
  <rect x="326" y="74" width="268" height="46" rx="18" fill="url(#stack)"/>
  <text x="460" y="103" text-anchor="middle" class="label white">Mini Snipara</text>

  <g>
    <rect x="326" y="140" width="76" height="70" rx="16" fill="#ecfeff" stroke="#67e8f9"/>
    <circle cx="364" cy="162" r="13" fill="#06b6d4"/>
    <path d="M351 184h26M351 194h26" class="line" stroke="#0891b2" stroke-width="2"/>
    <text x="364" y="229" text-anchor="middle" class="small">Companion</text>
  </g>
  <g>
    <rect x="422" y="140" width="76" height="70" rx="16" fill="#f0fdf4" stroke="#86efac"/>
    <path d="M442 158h36v36h-36z" fill="#22c55e" opacity=".9"/>
    <path d="M449 167h22M449 176h22M449 185h15" class="line" stroke="#ffffff" stroke-width="2"/>
    <text x="460" y="229" text-anchor="middle" class="small">Memory</text>
  </g>
  <g>
    <rect x="518" y="140" width="76" height="70" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <path d="M556 154l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#f97316"/>
    <text x="556" y="229" text-anchor="middle" class="small">Evals</text>
  </g>

  <text x="460" y="265" text-anchor="middle" class="small">Useful locally. No account required for local state.</text>

  <path d="M628 150h56" class="line dash" marker-end="url(#arrow)"/>
  <text x="656" y="132" text-anchor="middle" class="tiny">optional</text>

  <rect x="696" y="74" width="190" height="152" rx="22" fill="#4f46e5"/>
  <text x="791" y="108" text-anchor="middle" class="tiny white" opacity=".86">Snipara SaaS</text>
  <text x="791" y="145" text-anchor="middle" class="small white">shared memory</text>
  <text x="791" y="172" text-anchor="middle" class="small white">cloud code graph + impact</text>
  <text x="791" y="199" text-anchor="middle" class="small white">team coordination</text>
</svg>
