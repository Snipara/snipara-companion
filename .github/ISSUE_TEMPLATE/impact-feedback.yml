name: Impact output is wrong or surprising
description: Report missing, extra, or confusing local impact output.
title: "[impact] "
labels: ["impact-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when `impact` returns empty output, misses an import edge, shows a confusing warning, or reports a dependency that does not make sense.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npx -y snipara-companion@latest --version`.
      placeholder: "2.0.8"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command. Redact private paths if needed.
      render: shell
      placeholder: "npx -y snipara-companion impact src/auth/session.ts --source local"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Main language
      options:
        - TypeScript or JavaScript
        - Python
        - Go
        - Mixed
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: Include Incoming, Outgoing, Missing targets, and Warnings sections.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which incoming or outgoing files did you expect, and why?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Link a public repo, gist, or reduced file pair if possible.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, private keys, and customer data from this report.
          required: true

